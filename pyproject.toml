[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forms2apex-accelerator"
version = "0.1.0"
description = "Oracle Forms to Oracle APEX migration accelerator"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require the local Oracle database",
    "dbwrite: integration tests that modify Oracle data",
]